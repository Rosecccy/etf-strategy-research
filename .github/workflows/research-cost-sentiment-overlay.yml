name: research-cost-sentiment-overlay

on:
  push:
    branches:
      - research/cost-sentiment-overlay-20260826

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install research dependencies
        run: python -m pip install pandas numpy pytest
      - name: Run overlay unit tests
        run: python -m pytest -q tests/test_cost_sentiment_overlay.py
      - name: Run four-line overlay experiment
        run: python -m research.cost_sentiment_overlay.run_experiment --output research/cost_sentiment_overlay/out/summary.json
      - name: Print experiment summary
        if: success()
        run: cat research/cost_sentiment_overlay/out/summary.json
      - name: Upload experiment outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cost-sentiment-overlay-results
          path: research/cost_sentiment_overlay/out/
