<div id="phase-labels">
  <div class="viz-controls">
    <label class="form-label">年份
      <select class="form-select" data-year aria-label="选择年份"></select>
    </label>
    <span class="viz-badge" data-count></span>
  </div>
  <div class="phase-chart-wrap">
    <svg class="phase-chart" viewBox="0 0 960 440" role="img" aria-labelledby="phase-chart-title phase-chart-desc">
      <title id="phase-chart-title">红利ETF阶段高低点</title>
      <desc id="phase-chart-desc">真实收盘价曲线；红点为阶段低点买入，蓝点为阶段高点卖出。</desc>
      <g data-grid></g>
      <path data-price fill="none"></path>
      <g data-lows></g>
      <g data-highs></g>
      <g data-axes></g>
      <rect data-hit fill="transparent"></rect>
    </svg>
    <div class="tooltip" data-tooltip hidden></div>
  </div>
  <div class="viz-row text-small" aria-label="图例">
    <span><i class="phase-swatch phase-price" aria-hidden="true"></i>真实收盘价</span>
    <span><i class="phase-swatch phase-low" aria-hidden="true"></i>阶段低点：买入（红）</span>
    <span><i class="phase-swatch phase-high" aria-hidden="true"></i>阶段高点：卖出（蓝）</span>
  </div>
  <p class="text-small text-muted" data-detail></p>
</div>

<style>
  #phase-labels { color: var(--foreground); }
  .phase-chart-wrap { position: relative; width: 100%; }
  .phase-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .phase-chart [data-grid] line { stroke: var(--border); stroke-width: 1; }
  .phase-chart [data-axes] text { fill: var(--muted-foreground); font-size: 14px; }
  .phase-chart [data-axes] path { fill: none; stroke: var(--muted-foreground); stroke-width: 1; }
  .phase-chart [data-price] { stroke: var(--viz-series-1); stroke-width: 2.5; }
  .phase-chart [data-lows] circle { fill: var(--destructive); stroke: var(--card); stroke-width: 2; }
  .phase-chart [data-highs] rect { fill: var(--viz-series-2); stroke: var(--card); stroke-width: 2; }
  .tooltip { position: absolute; max-width: 17rem; pointer-events: none; z-index: 2; }
  .phase-swatch { display: inline-block; width: .8rem; height: .8rem; margin-right: .3rem; vertical-align: -.08rem; }
  .phase-price { border-radius: 50%; background: var(--viz-series-1); }
  .phase-low { border-radius: 50%; background: var(--destructive); }
  .phase-high { background: var(--viz-series-2); }
</style>

<script>
(() => {
  const DATA = __DATA__;
  const root = document.getElementById('phase-labels');
  const select = root.querySelector('[data-year]');
  const count = root.querySelector('[data-count]');
  const svg = root.querySelector('.phase-chart');
  const grid = root.querySelector('[data-grid]');
  const axes = root.querySelector('[data-axes]');
  const pricePath = root.querySelector('[data-price]');
  const lows = root.querySelector('[data-lows]');
  const highs = root.querySelector('[data-highs]');
  const hit = root.querySelector('[data-hit]');
  const tooltip = root.querySelector('[data-tooltip]');
  const detail = root.querySelector('[data-detail]');
  const NS = 'http://www.w3.org/2000/svg';
  const box = { width: 960, height: 440, left: 74, right: 30, top: 26, bottom: 62 };
  let current = null;

  function svgEl(name, attrs = {}) {
    const node = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, value));
    return node;
  }
  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
  function price(value) { return Number(value).toFixed(3); }
  function dateLabel(value) { return value.slice(5); }
  function eventText(point) {
    const tags = [];
    if (point.low) tags.push('阶段低点：买入');
    if (point.high) tags.push('阶段高点：卖出');
    return tags.length ? tags.join('；') : '无阶段点';
  }
  function draw() {
    const year = select.value;
    const points = DATA.byYear[year];
    const values = points.map(item => item.close);
    const min = Math.min(...values);
    const max = Math.max(...values);
    const pad = Math.max((max - min) * .08, max * .01);
    const lower = min - pad;
    const upper = max + pad;
    const width = box.width - box.left - box.right;
    const height = box.height - box.top - box.bottom;
    const x = index => box.left + index / Math.max(1, points.length - 1) * width;
    const y = value => box.top + (upper - value) / Math.max(.000001, upper - lower) * height;
    current = { points, x, y, width, height };
    clear(grid); clear(axes); clear(lows); clear(highs);
    pricePath.setAttribute('d', points.map((point, index) => `${index ? 'L' : 'M'}${x(index).toFixed(2)},${y(point.close).toFixed(2)}`).join(' '));
    for (let tick = 0; tick <= 4; tick += 1) {
      const value = lower + (upper - lower) * tick / 4;
      const yy = y(value);
      grid.appendChild(svgEl('line', { x1: box.left, y1: yy, x2: box.width - box.right, y2: yy }));
      const label = svgEl('text', { x: box.left - 10, y: yy + 5, 'text-anchor': 'end' });
      label.textContent = price(value); axes.appendChild(label);
    }
    for (let tick = 0; tick <= 4; tick += 1) {
      const index = Math.round((points.length - 1) * tick / 4);
      const xx = x(index);
      grid.appendChild(svgEl('line', { x1: xx, y1: box.top, x2: xx, y2: box.height - box.bottom }));
      const label = svgEl('text', { x: xx, y: box.height - box.bottom + 24, 'text-anchor': 'middle' });
      label.textContent = dateLabel(points[index].date); axes.appendChild(label);
    }
    axes.appendChild(svgEl('path', { d: `M${box.left},${box.top}V${box.height - box.bottom}H${box.width - box.right}` }));
    points.forEach((point, index) => {
      if (point.low) lows.appendChild(svgEl('circle', { cx: x(index), cy: y(point.close), r: 5.5 }));
      if (point.high) highs.appendChild(svgEl('rect', { x: x(index) - 5, y: y(point.close) - 5, width: 10, height: 10, rx: 1 }));
    });
    const buyCount = points.filter(point => point.low).length;
    const sellCount = points.filter(point => point.high).length;
    count.textContent = `${year}：${buyCount}个买点，${sellCount}个卖点`;
    detail.textContent = `前后${DATA.window}日的近似双顶/双底：5日内且价格差不超过0.5%的极值合并为一个阶段点，取首次最高/最低价。全部阶段顶部和底部独立保留，不做买卖配对。`;
    hit.setAttribute('x', box.left); hit.setAttribute('y', box.top); hit.setAttribute('width', width); hit.setAttribute('height', height);
    tooltip.hidden = true;
  }
  function hover(event) {
    if (!current) return;
    const rect = svg.getBoundingClientRect();
    const localX = (event.clientX - rect.left) / rect.width * box.width;
    const ratio = (localX - box.left) / current.width;
    const index = Math.max(0, Math.min(current.points.length - 1, Math.round(ratio * (current.points.length - 1))));
    const point = current.points[index];
    tooltip.textContent = `${point.date}｜收盘价 ${price(point.close)}｜${eventText(point)}`;
    tooltip.style.left = `${Math.max(8, Math.min(rect.width - 230, event.clientX - rect.left + 14))}px`;
    tooltip.style.top = `${Math.max(8, event.clientY - rect.top + 14)}px`;
    tooltip.hidden = false;
  }
  function leave() { tooltip.hidden = true; }
  DATA.years.forEach(year => {
    const option = document.createElement('option');
    option.value = year; option.textContent = `${year}年`;
    select.appendChild(option);
  });
  select.value = DATA.defaultYear;
  select.addEventListener('change', draw);
  hit.addEventListener('mousemove', hover);
  hit.addEventListener('mouseleave', leave);
  draw();
})();
</script>
